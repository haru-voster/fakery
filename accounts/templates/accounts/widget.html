<style>.wa{position:fixed;left:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20}
.wat{position:fixed;left:84px;bottom:28px;background:#fff;color:#111;padding:8px 12px;border-radius:8px;font-size:14px;z-index:20}
.chatb{position:fixed;right:16px;bottom:16px;background:linear-gradient(90deg,#1e63e9,#164bb8);color:#fff;border:0;border-radius:999px;padding:16px 24px;font:600 16px system-ui;z-index:20;cursor:pointer;width:auto}
.chatb .dot{position:absolute;left:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:#35e07a;border:2px solid #fff}
.chatp{position:fixed;right:16px;bottom:84px;width:min(320px,calc(100vw - 32px));background:#232a3b;color:#eef2ff;border:1px solid #2d3650;border-radius:14px;padding:16px;z-index:21;box-sizing:border-box}
.chatp[hidden]{display:none}.chatp input,.chatp textarea{margin-top:8px;background:#2a3145;color:#fff;border:1px solid #2d3650;border-radius:10px;padding:10px;width:100%;box-sizing:border-box;font:inherit}.chatp button{width:100%;margin-top:10px}.visb{position:fixed;right:16px;top:calc(78px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:50%;background:#232a3b;color:#fff;border:1px solid #2d3650;z-index:100;cursor:pointer;font-size:21px;padding:0;box-shadow:0 4px 16px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center}
.visp{position:fixed;right:16px;top:calc(132px + env(safe-area-inset-top,0px));width:260px;background:#232a3b;color:#eef2ff;border:1px solid #2d3650;border-radius:14px;padding:14px;z-index:101;box-sizing:border-box;box-shadow:0 12px 32px rgba(0,0,0,.28)}.visp[hidden]{display:none}@media(max-width:600px){.visb{top:calc(72px + env(safe-area-inset-top,0px));right:12px}.visp{top:calc(124px + env(safe-area-inset-top,0px));right:12px;width:min(260px,calc(100vw - 24px))}.chatb{right:12px;bottom:12px}.wa{left:12px;bottom:12px}} </style>
<a class="wa fx" target="_blank" rel="noopener" aria-label="WhatsApp" href="https://wa.me/{{ WHATSAPP_NUMBER }}"><svg viewBox="0 0 24 24" width="30" height="30" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg></a><span class="wat fx">Message us</span>
<button class="visb fx" id="vb" type="button" aria-label="Appearance and visibility settings" title="Appearance and visibility">&#9790;</button>
<div class="visp fx" id="vp" hidden><b>Appearance &amp; visibility</b><div style="margin-top:8px;font-size:13px;color:#9aa5cc">Brightness <span id="brv">100</span>%</div><input type="range" id="br" min="60" max="120" value="100" style="width:100%">
<div style="display:flex;gap:6px;margin-top:10px"><button type="button" class="vt" data-t="auto" style="margin:0;padding:6px">Auto</button><button type="button" class="vt" data-t="light" style="margin:0;padding:6px">Light</button><button type="button" class="vt" data-t="dark" style="margin:0;padding:6px">Dark</button></div></div>
<button class="chatb fx" id="chb" type="button"><span class="dot"></span>Chat</button>
<form class="chatp fx" id="chp" hidden>{% csrf_token %}<b>Message us</b><div style="font-size:13px;color:#9aa5cc;margin-top:4px">We reply by SMS or WhatsApp.</div>
<input name="name" placeholder="Your name" required maxlength="60"><input name="phone" placeholder="Phone e.g. +1 774 699 7556" maxlength="20"><textarea name="message" rows="3" required maxlength="500" placeholder="How can we help?"></textarea>
<button class="btn">Send</button><div id="cmsg" style="font-size:13px;color:#9aa5cc;margin-top:8px"></div>{% if SUPPORT_PHONE %}<a style="color:#35e07a;font-size:14px" href="sms:{{ SUPPORT_PHONE }}">Or text us by SMS</a>{% endif %}</form>
<script>(function(){const R=document.documentElement,g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},s=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function theme(p){R.classList.toggle("light",p==="light");if(p==="auto")R.removeAttribute("data-theme");else R.setAttribute("data-theme",p);const icon=document.getElementById("vb");if(icon){icon.textContent=p==="light"?"☀":"☾";icon.setAttribute("aria-label",p==="light"?"Switch appearance and visibility settings":"Appearance and visibility settings")}}
const b=+g("br")||100,i=document.getElementById("br");i.value=b;document.getElementById("brv").textContent=b;R.style.setProperty("--br",b/100);theme(g("pref")||"auto");
i.oninput=e=>{R.style.setProperty("--br",e.target.value/100);document.getElementById("brv").textContent=e.target.value;s("br",e.target.value)};
document.querySelectorAll(".vt").forEach(x=>x.onclick=()=>{s("pref",x.dataset.t);theme(x.dataset.t)});
document.getElementById("vb").onclick=()=>{const p=document.getElementById("vp");p.hidden=!p.hidden}})();
document.getElementById("chb").onclick=()=>{const p=document.getElementById("chp");p.hidden=!p.hidden};
document.getElementById("chp").onsubmit=async e=>{e.preventDefault();const f=e.target,m=document.getElementById("cmsg");
try{const r=await fetch("{% url 'support' %}",{method:"POST",body:new FormData(f)});const j=await r.json();
m.textContent=r.ok?"Thanks, we will get back to you shortly.":(j.error||"Could not send.");if(r.ok)f.message.value=""}catch(x){m.textContent="Network error. Try WhatsApp instead."}};</script>
